<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پخت‌نگار — جامعه آشپزی، کیک‌پزی و نان‌پزی</title>
    <meta
      name="description"
      content="محیطی برای ثبت و اشتراک‌گذاری دستورهای آشپزی، کیک‌پزی و نان‌پزی با جستجوی مواد یخچال، ویدیوهای واقعی، امتیازدهی و مود تیره و روشن آشپزخانه."
    />
    <meta property="og:title" content="پخت‌نگار — جامعه آشپزی، کیک‌پزی و نان‌پزی" />
    <meta
      property="og:description"
      content="ثبت ایده و دستور پخت بدون نیاز به مشخصات شخصی، جستجو با مواد داخل یخچال، فیلتر گیاهی و رژیمی و اشتراک‌گذاری ویدیوهای واقعی آشپزی."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#C25E00" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

      href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('pokhtnegar_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAF9F6] text-[#1C1917] dark:bg-[#141210] dark:text-[#F5F2EB] antialiased selection:bg-amber-500/20">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
